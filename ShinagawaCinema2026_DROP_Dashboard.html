<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>品川国際映画祭2026 × みんまちDROP 流入・利用レポート</title>
<style>
:root {
  --color-fg: #1f2328; --color-fg-muted: #5b6770; --color-bg: #fafaf8; --color-panel: #ffffff; --color-border-line: #e3e6e8;
  --color-ok: #2A78D6; --color-warn: #F5B82E; --color-bad: #D03B3B;
  --font-anthropic-sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 22px; --cds-font-weight-medium: 600;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 16px; --cds-gap-xl: 28px;
  --cds-pad-sm: 6px; --cds-pad-md: 10px; --cds-pad-lg: 16px; --cds-radius: 8px;
  --cds-chart-grid: #edf0f1; --cds-chart-axis: #c3cbcf; --cds-text-secondary: #5b6770;
  --cds-surface-popover: #ffffff; --cds-border: #d9dee1; --cds-shadow-popover: 0 4px 14px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark) {
  :root { --color-fg: #e8eaeb; --color-fg-muted: #a3adb3; --color-bg: #16191b; --color-panel: #1e2225; --color-border-line: #323a3f;
    --cds-chart-grid: #2b3236; --cds-chart-axis: #4a555b; --cds-text-secondary: #a3adb3; --cds-surface-popover: #262b2e; --cds-border: #3a4449; }
}
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); }
#dash-root { max-width: 1280px; margin: 0 auto; padding: 24px 24px 40px; }
@media (max-width: 520px) { #dash-root { padding: 16px 12px 32px; } }
.dash-skeleton { color: transparent; }
.sc-foot { margin-top: var(--cds-gap-lg); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.sc-cap-after { margin: var(--cds-gap-sm) 0 0; }
.sc-csv { font: inherit; font-size: 11px; padding: 2px 10px; border: 1px solid var(--color-border-line); border-radius: 999px; background: var(--color-panel); color: var(--color-fg); cursor: pointer; }
.sc-csv:hover { border-color: #0E3B4A; }
.sc-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
/* パスワード画面 */
.sc-login { max-width: 460px; margin: 12vh auto 0; background: var(--color-panel); border: 1px solid var(--color-border-line); border-top: 3px solid #0E3B4A; border-radius: var(--cds-radius); padding: 28px; }
.sc-login h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; line-height: 1.4; }
.sc-login p { font-size: 13px; color: var(--color-fg-muted); margin: 0 0 16px; line-height: 1.6; }
.sc-login form { display: flex; gap: 8px; }
.sc-login input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--color-border-line); border-radius: 6px; background: var(--color-bg); color: var(--color-fg); }
.sc-login button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border: 0; border-radius: 6px; background: #0E3B4A; color: #fff; cursor: pointer; }
.sc-login button:disabled { opacity: .6; cursor: wait; }
.sc-login-msg { min-height: 1.4em; margin: 10px 0 0 !important; color: var(--color-bad) !important; }
.sc-login-meta { margin: 16px 0 0 !important; font-size: 11px !important; border-top: 1px solid var(--color-border-line); padding-top: 12px; }
@media print { .sc-toc { position: static; } }
/* 品川国際映画祭2026 × みんまちDROP 流入・利用レポート（CULTURE SNACK 効果検証レポートと同じ見た目の決まり） */
.sc{
  --sc-hi:#BE258D; --sc-hi-l:#E7A3CF; --sc-gray:#B9C4C9; --sc-gray-l:#E4E9EB; --sc-gray-m:#8A979D; --sc-ink2:#5B6770;
  --sc-struct:#0E3B4A; --sc-struct2:#2F5D6B;
  --sc-more:#0099AE; --sc-more-l:#A5DCE4; --sc-less:#E07B39; --sc-less-l:#F4CDB1;
  --sc-band:rgba(98,57,160,.08); --sc-band-bd:#6239A0;
  --sc-fact-bg:rgba(42,120,214,.10); --sc-fact-bd:#9EC5F4; --sc-fact-tag:#9EC5F4;
  --sc-hyp-bg:rgba(245,184,46,.14); --sc-hyp-bd:#F5B82E;
  font-family:var(--font-anthropic-sans), 'Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif;
  color:var(--color-fg); line-height:1.65; max-width:1180px; margin:0 auto;
}
.sc.sc-dark{
  --sc-struct:#9CC3D0; --sc-struct2:#9CC3D0; --sc-gray-l:#343B3F; --sc-ink2:#C3CDD1;
  --sc-more-l:#235E68; --sc-less-l:#6E4126;
  --sc-band:rgba(166,139,230,.14); --sc-band-bd:#A68BE6;
  --sc-fact-bg:rgba(106,166,238,.14); --sc-fact-bd:#2E5E96;
  --sc-hyp-bg:rgba(245,184,46,.12); --sc-hyp-bd:#A9811F;
}
.sc-dark .sc-secn,.sc-dark .sc-toc-n,.sc-dark .sc-part{color:#0b1f26}
.sc *{box-sizing:border-box}
.sc b{font-variant-numeric:tabular-nums}
.sc p{margin:0 0 8px}
.sc [id]{scroll-margin-top:10px}
.sc-main{min-width:0}

/* 目次（広い画面は左に固定、せまい画面は上に横並び） */
.sc-toc{font-size:12.5px;margin:0 0 12px}
.sc-toc-h{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--sc-struct);margin:0 0 2px !important}
.sc-toc a{display:block;color:var(--color-fg);text-decoration:none;line-height:1.35;padding:3px 8px;border-left:2px solid transparent;border-radius:0 6px 6px 0}
.sc-toc a:hover{background:var(--sc-gray-l)}
.sc-toc a.lv1{font-weight:600;margin-top:6px}
.sc-toc a.lv2{font-size:12px;color:var(--color-fg-muted);padding-left:16px}
.sc-toc a.is-on{border-left-color:var(--sc-struct);background:var(--sc-gray-l);color:var(--color-fg)}
.sc-toc-n{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--sc-struct);color:#fff;font-size:11px;margin-right:5px;vertical-align:1px}
.sc-toc-part{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--sc-struct2);margin:12px 0 0 !important;padding:2px 8px;border-top:1px solid var(--color-border-line)}
@media (min-width:700px){
  .sc{display:grid;grid-template-columns:172px minmax(0,1fr);column-gap:22px;max-width:1380px}
  .sc-toc{position:sticky;top:10px;align-self:start;max-height:calc(100vh - 20px);overflow-y:auto;margin:0;padding:2px 6px 12px 0;border-right:1px solid var(--color-border-line)}
}
@media (max-width:699.98px){
  .sc-toc{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
  .sc-toc-h{margin:0 4px 0 0 !important}
  .sc-toc a,.sc-toc a.lv1{display:inline-block;margin:0;padding:2px 10px;border:1px solid var(--color-border-line);border-radius:999px;background:var(--color-panel)}
  .sc-toc a.lv2,.sc-toc-part{display:none}
  .sc-toc a.is-on{border-color:var(--sc-struct)}
}

/* 見出しまわり */
.sc-badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--sc-gray-l);font-weight:600;margin:0 0 6px !important}
.sc-title{font-size:var(--cds-font-size-title, 24px);font-weight:600;line-height:1.35;margin:0 0 4px;color:var(--sc-struct)}
.sc-sub{font-size:13px;color:var(--color-fg-muted)}
.sc-lead{font-size:16px;font-weight:600;margin:10px 0 12px !important;padding-left:10px;border-left:4px solid var(--sc-struct);max-width:62em}
.sc-legend{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:12px;color:var(--color-fg-muted);margin:0 0 14px !important}
.sc-legend > span{display:inline-flex;align-items:center;gap:5px}
.sc-sw{display:inline-block;width:11px;height:11px;border-radius:2px;flex:none}
.sc-legend .sc-sw + .sc-sw{margin-left:-3px}
.sw-hi{background:var(--sc-hi)} .sw-hil{background:var(--sc-hi-l)} .sw-gray{background:var(--sc-gray)} .sw-more{background:var(--sc-more)} .sw-less{background:var(--sc-less)} .sw-band{background:var(--sc-band);outline:1px solid var(--sc-band-bd)}
.sc-boxsw{display:inline-block;width:18px;height:12px;border-radius:3px}
.sc-boxsw.is-fact{background:var(--sc-fact-bg);border:1px solid var(--sc-fact-bd)}
.sc-boxsw.is-hyp{background:var(--sc-hyp-bg);border:1px solid var(--sc-hyp-bd)}

/* 要点のカード */
.sc-sum{margin:0 0 6px}
.sc-sum-h{font-size:14px;font-weight:700;color:var(--sc-struct);margin:0 0 8px}
.sc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.sc-kcard{display:flex;flex-direction:column;gap:4px;background:var(--color-panel);border:1px solid var(--color-border-line);border-top:3px solid var(--sc-struct);border-radius:var(--cds-radius,10px);padding:12px 14px;color:var(--color-fg);text-decoration:none;min-width:0}
.sc-kcard:hover{border-color:var(--sc-struct2)}
.sc-kcard-t{font-size:14.5px;font-weight:700;color:var(--sc-struct);line-height:1.4}
.sc-big{font-weight:600;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--color-fg)}
.sc-big b{font-weight:600}
.sc-big small{font-size:15px;font-weight:600;margin-left:2px;color:var(--color-fg-muted)}
.sc-big em{font-style:normal;font-size:18px;margin:0 5px;color:var(--color-fg-muted)}
.sc-kcard-s{font-size:12px;color:var(--color-fg-muted);line-height:1.45}
.sc-kcard-f{font-size:12.5px;font-weight:600;margin-top:auto;padding-top:6px;border-top:1px dashed var(--color-border-line)}
.sc-kcard.is-full{grid-column:1 / -1}
.sc-mini{position:relative;display:block;margin:4px 0 2px;min-height:44px}
.sc-sum-foot{font-size:12px;color:var(--color-fg-muted);margin:8px 0 0 !important}
.sc-droplist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:4px 18px;margin:4px 0 0;font-size:12.5px}
.sc-droplist > span{display:flex;gap:6px;align-items:baseline;line-height:1.45}
.sc-droplist i{flex:none;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--sc-gray-l);font-style:normal;font-size:10.5px;font-weight:700}

/* 部・節 */
.sc-part{font-size:13px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--sc-struct);display:inline-block;padding:3px 14px;border-radius:999px;margin:26px 0 0 !important}
.sc-sec{padding-top:22px}
.sc-h2{display:flex;gap:10px;align-items:baseline;font-size:var(--cds-font-size-heading, 19px);font-weight:600;line-height:1.45;margin:0 0 10px;color:var(--sc-struct)}
.sc-secn{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sc-struct);color:#fff;font-size:15px;transform:translateY(2px)}
.sc-intro{font-size:13.5px;color:var(--color-fg-muted)}
.sc-fact,.sc-hyp{border-radius:var(--cds-radius,10px);padding:10px 14px;margin:0 0 12px;font-size:14px}
.sc-fact{background:var(--sc-fact-bg);border:1px solid var(--sc-fact-bd)}
.sc-hyp{background:var(--sc-hyp-bg);border:1px solid var(--sc-hyp-bd)}
.sc-fact p:last-child,.sc-hyp p:last-child{margin:0}
.sc-tag{display:inline-block;font-size:11.5px;font-weight:600;padding:0 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.sc-fact .sc-tag{background:var(--sc-fact-tag);color:#0b2440}
.sc-hyp .sc-tag{background:var(--sc-hyp-bd);color:#2a1d00}
.sc-caution{font-size:12.5px;color:var(--color-fg-muted);margin:4px 0 0 !important}
.sc-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px;margin:0 0 12px}
.sc-grid2 > .sc-card{margin:0}
.sc-card{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius,10px);padding:var(--cds-pad-lg,16px);margin:0 0 12px;min-width:0}
.sc-h3{font-size:15px;font-weight:600;margin:0 0 2px;line-height:1.45;padding-left:9px;border-left:3px solid var(--sc-struct2)}
.sc-cap{font-size:12px;color:var(--color-fg-muted);margin:2px 0 10px !important;line-height:1.55}
.sc-cap b{color:var(--color-fg)}
.sc-note{font-size:13px;margin:10px 0 0 !important}
.sc-chart{position:relative;min-height:120px}
.sc-chart.is-tall{min-height:240px}
.sc-chart.is-short{min-height:44px}
.sc-chart svg,.sc-mini svg{display:block;overflow:visible}
.sc-chart text,.sc-mini text{font-family:inherit}
.sc-err{color:var(--color-bad);font-size:var(--cds-font-size-caption)}
.sc-scroll{overflow-x:auto}
.sc-next{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.sc-next .sc-hyp{margin:0}
.sc-next a{font-size:12px;margin-left:4px;color:var(--sc-struct2)}
.sc-defs{margin:24px 0 8px;font-size:13px}
.sc-defs summary{cursor:pointer;font-weight:600;color:var(--sc-struct)}
.sc-defs h4{margin:12px 0 4px;font-size:13.5px}
.sc-defs ul{margin:0;padding-left:1.2em;line-height:1.7}
.sc-foot{font-size:11.5px;color:var(--color-fg-muted);margin:18px 0 0 !important;padding-top:8px;border-top:1px solid var(--color-border-line)}

/* 小さな図（カード） */
.sc-stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--sc-gray-l);gap:1px}
.sc-stack.is-big{height:22px}
.sc-seg{display:flex;align-items:center;justify-content:center;min-width:2px;font-size:11px;font-weight:600;color:#1f2a30;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.sc-seg.is-hi{color:#fff}
.sc-mini-leg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:var(--color-fg-muted);margin-top:4px}
.sc-mini-leg span{display:inline-flex;align-items:center;gap:3px}
.sc-mini-leg i{display:inline-block;width:9px;height:9px;border-radius:2px}
.sc-mrow{display:grid;grid-template-columns:minmax(7.5em,42%) 1fr;gap:6px;align-items:center;font-size:11.5px;margin:0 0 3px}
.sc-mrow-l{line-height:1.25;overflow-wrap:anywhere}
.sc-mrow-t{display:flex;align-items:center;gap:5px;min-width:0}
.sc-mrow-t i{display:block;height:11px;border-radius:0 3px 3px 0;background:var(--sc-gray)}
.sc-mrow.is-hi .sc-mrow-t i{background:var(--sc-hi)}
.sc-mrow.is-hi .sc-mrow-l,.sc-mrow.is-hi b{font-weight:700}
.sc-mrow b{font-size:11.5px;font-weight:500;white-space:nowrap}

/* 横の棒（HTML） */
.sc-hb{display:flex;flex-direction:column;gap:6px}
.sc-hb-head{display:flex;justify-content:space-between;gap:8px;font-size:var(--cds-font-size-caption);font-weight:600;border-bottom:1px solid var(--color-border-line);padding:8px 0 3px}
.sc-hb-head:first-child{padding-top:0}
.sc-hb-headsub{color:var(--color-fg-muted);font-variant-numeric:tabular-nums}
.sc-hb-note{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);line-height:1.6}
.sc-hb-row{display:grid;grid-template-columns:minmax(6em,var(--sc-lw,11em)) 1fr;gap:10px;align-items:center;font-size:var(--cds-font-size-caption)}
.sc-hb-label{line-height:1.35;overflow-wrap:anywhere}
.sc-hb-sub{color:var(--color-fg-muted);font-size:11px}
.sc-hb-track{display:flex;align-items:center;min-height:18px}
.sc-hb-bar{height:14px;flex:none}
.sc-hb-bar:first-child{border-radius:4px 0 0 4px}
.sc-hb-bar:nth-last-child(2){border-top-right-radius:4px;border-bottom-right-radius:4px}
.sc-hb-bar + .sc-hb-bar{margin-left:2px}
.sc-hb-val{margin-left:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:520px){ .sc-hb-row{--sc-lw:8.5em} }

/* SVG 共通 */
.sc-svg{display:block;overflow:visible}
.sc-tick{font-size:11px;fill:var(--cds-text-secondary)}
.sc-vlabel,.sc-sub{font-size:11px;fill:var(--color-fg);font-variant-numeric:tabular-nums}
.sc-missing{font-size:11px;fill:var(--color-fg-muted)}
line.sc-gridline{stroke:var(--cds-chart-grid)}
.sc-axis{stroke:var(--cds-chart-axis)}
.sc-band{fill:var(--sc-band)}
.sc-band-label{font-size:11px;fill:var(--cds-text-secondary)}
.sc-vbar{stroke:var(--color-panel);stroke-width:1}
.sc-hit{fill:transparent}
.sc-ann-line{stroke:var(--color-fg-muted);stroke-dasharray:2 2}
.sc-ann{font-size:11px;font-weight:600;fill:var(--color-fg)}
.sc-tip{position:absolute;z-index:5;pointer-events:none;background:var(--cds-surface-popover);border:1px solid var(--cds-border);box-shadow:var(--cds-shadow-popover);border-radius:6px;padding:6px 9px;font-size:var(--cds-font-size-caption);line-height:1.5;max-width:300px;color:var(--color-fg)}
.sc-tip-h{font-weight:600}
.sc-tip div:not(.sc-tip-h){color:var(--cds-text-secondary)}

/* 流れ図 */
.sc-flow{min-height:420px}
.sc-fl-head{font-size:12px;font-weight:700;fill:var(--sc-struct)}
.sc-fl-node{fill:var(--sc-ink2)}
.sc-fl-link{opacity:.38}
.sc-fl-link.is-dim{opacity:.1}
.sc-fl-link.is-on{opacity:.72}
.sc-fl-lab{font-size:12px;fill:var(--color-fg);paint-order:stroke;stroke:var(--color-panel);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.sc-fl-lab tspan.n{fill:var(--color-fg-muted);font-variant-numeric:tabular-nums}
.sc-fl-lab.is-on{font-weight:700}
.sc-fl-hit{fill:transparent;cursor:pointer;outline:none}
.sc-fl-hit:focus-visible{stroke:var(--sc-hi);stroke-width:2px}

/* ダンベル（告知期間 → 開催期間） */
.sc-db{display:grid;gap:2px}
.sc-db-axis,.sc-db-row{display:grid;grid-template-columns:minmax(8em,24%) minmax(0,1fr) 10.5em;gap:4px 10px;align-items:center;font-size:12.5px}
.sc-db-axis{font-size:11px;color:var(--color-fg-muted)}
.sc-db-ticks{position:relative;height:16px}
.sc-db-ticks span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.sc-db-row{padding:3px 0;border-radius:6px}
.sc-db-row:hover{background:var(--sc-gray-l)}
.sc-db-lab{line-height:1.3;overflow-wrap:anywhere}
.sc-db-tr{position:relative;height:18px;min-width:80px}
.sc-db-tr::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--color-border-line)}
.sc-db-bar{position:absolute;top:calc(50% - 2px);height:4px;border-radius:2px}
.sc-db-row.is-up .sc-db-bar{background:var(--sc-more-l)} .sc-db-row.is-down .sc-db-bar{background:var(--sc-less-l)}
.sc-db-a,.sc-db-b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%}
.sc-db-a{background:var(--color-panel);border:2px solid var(--sc-ink2)}
.sc-db-row.is-up .sc-db-b{background:var(--sc-more)} .sc-db-row.is-down .sc-db-b{background:var(--sc-less)} .sc-db-row.is-flat .sc-db-b{background:var(--sc-ink2)}
.sc-db-v{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.sc-db-v small{color:var(--color-fg-muted);font-size:11px}
.sc-db-row.is-up .sc-db-v b{color:var(--sc-more)} .sc-db-row.is-down .sc-db-v b{color:var(--sc-less)}
.sc-db-key{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11.5px;color:var(--color-fg-muted);margin:0 0 6px}
.sc-db-key span{display:inline-flex;align-items:center;gap:5px}
.sc-db-key i{display:inline-block;width:10px;height:10px;border-radius:50%}
.sc-db-key .k-a{background:var(--color-panel);border:2px solid var(--sc-ink2)} .sc-db-key .k-up{background:var(--sc-more)} .sc-db-key .k-down{background:var(--sc-less)}

<script>// claude.ai のダッシュボード（dash）と同じ呼び方で描画コードを動かすための小さな置き換え。
// データは window.DASH_DATA（パスワードで復号した集計表）から渡す。
// dash.calc（集計表から作る表）と dash.params／setParams（「運営の投稿を含める」の切り替え）にも対応する。
window.DASH_DATA = {};
(function () {
  const draws = [];
  const calcs = {};
  const params = { ops: 'general' };   // 切り替えの初期値（一般の投稿だけ）
  const rows = (id) => {
    if (calcs[id]) {
      const c = calcs[id];
      if (c.inputs.some((i) => !window.DASH_DATA[i])) return null;
      return c.fn(...c.inputs.map((i) => window.DASH_DATA[i]));
    }
    return window.DASH_DATA[id] || null;
  };
  window.dash = {
    data: (id) => {
      try {
        const r = rows(id);
        return r ? { status: 'ok', data: r } : { status: 'missing', data: [] };
      } catch (e) {
        console.error(id, e);
        return { status: 'error', data: [] };
      }
    },
    calc: (id, def) => { calcs[id] = def; },
    draw: (name, fn) => { draws.push([name, fn]); },
    onData: (fn) => fn(),
    setLink: (name) => { try { history.replaceState(null, '', '#' + name); } catch (e) { /* 何もしない */ } },
    params: () => ({ ...params }),
    setParams: (o) => { Object.assign(params, o || {}); if (window.__runDraws) window.__runDraws(); },
    resetParams: () => { Object.keys(params).forEach((k) => delete params[k]); params.ops = 'general'; if (window.__runDraws) window.__runDraws(); },
    refresh: () => { if (window.__runDraws) window.__runDraws(); },
    colors: [],
  };
  window.__runDraws = () => {
    for (const [name, fn] of draws) {
      document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => {
        try { fn(el); } catch (e) { console.error(name, e); }
      });
    }
  };
})();
</script>
<script>(function () {
  const SC = (window.SC = {});
  SC.C = { accent: '#BE258D', gray: '#B9C4C9', grayDark: '#5B6770', pre: '#BFAAEF', during: '#6239A0', teal: '0,153,174' };

  SC.fmt = (v, f) => {
    if (v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v))) return '—';
    const n = +v;
    if (f === 'pct') return n.toFixed(1) + '%';
    if (f === 'dec1') return n.toFixed(1);
    if (f === 'int') return d3.format(',')(n);
    return String(v);
  };
  SC.md = (s) => { const p = String(s).split('-'); return +p[1] + '/' + +p[2]; };

  SC.pick = (rows, el) => {
    if (el.dataset.row != null) return rows[+el.dataset.row];
    if (el.dataset.where) {
      const conds = el.dataset.where.split('&').map((p) => p.split('=').map(decodeURIComponent));
      return rows.find((r) => conds.every(([k, v]) => String(r[k]) === v));
    }
    return rows[0];
  };

  // 読み込み状態の処理：rows の配列を返す。読み込み中・失敗なら null
  SC.ready = (el, ids) => {
    const ds = ids.map((id) => dash.data(id));
    if (ds.some((d) => d.status === 'loading')) return null;
    el.classList.remove('dash-skeleton');
    const bad = ds.find((d) => d.status !== 'ok');
    if (bad) {
      if (bad.status === 'error' || bad.status === 'missing') {
        const p = document.createElement('p');
        p.className = 'sc-err';
        p.textContent = 'この図のデータを読み込めませんでした。';
        el.replaceChildren(p);
      } else el.replaceChildren('—');
      return null;
    }
    return ds.map((d) => d.data);
  };

  SC.tip = (el) => {
    const t = document.createElement('div');
    t.className = 'sc-tip';
    t.hidden = true;
    el.append(t);
    return {
      show(ev, lines) {
        t.replaceChildren(...lines.map((s, i) => { const d = document.createElement('div'); d.textContent = s; if (i === 0) d.className = 'sc-tip-h'; return d; }));
        t.hidden = false;
        const b = el.getBoundingClientRect();
        let x = ev.clientX - b.left + 14;
        const y = ev.clientY - b.top + 14;
        if (x + t.offsetWidth > el.clientWidth) x = Math.max(0, ev.clientX - b.left - t.offsetWidth - 14);
        t.style.left = x + 'px';
        t.style.top = y + 'px';
      },
      hide() { t.hidden = true; },
    };
  };

  // 横棒（HTML）。items: {type:'header', text, sub} か {label, sub, segs:[{v,color}], valueText, tip:[...]}
  SC.hbars = (el, items, o = {}) => {
    const bars = items.filter((i) => i.segs);
    const max = o.max || d3.max(bars, (i) => d3.sum(i.segs, (s) => +s.v || 0)) || 1;
    const wrap = document.createElement('div');
    wrap.className = 'sc-hb';
    if (o.labelWidth) wrap.style.setProperty('--sc-lw', o.labelWidth);
    const tips = new Map();
    for (const it of items) {
      if (it.type === 'note') {
        const n = document.createElement('div');
        n.className = 'sc-hb-note';
        n.textContent = it.text;
        wrap.append(n);
        continue;
      }
      if (it.type === 'header') {
        const h = document.createElement('div');
        h.className = 'sc-hb-head';
        const a = document.createElement('span'); a.textContent = it.text; h.append(a);
        if (it.sub) { const b = document.createElement('span'); b.className = 'sc-hb-headsub'; b.textContent = it.sub; h.append(b); }
        wrap.append(h);
        continue;
      }
      const row = document.createElement('div');
      row.className = 'sc-hb-row';
      const lab = document.createElement('div');
      lab.className = 'sc-hb-label';
      lab.textContent = it.label;
      if (it.sub) { const s = document.createElement('div'); s.className = 'sc-hb-sub'; s.textContent = it.sub; lab.append(s); }
      const track = document.createElement('div');
      track.className = 'sc-hb-track';
      for (const s of it.segs) {
        const v = +s.v || 0;
        if (!v) continue;
        const b = document.createElement('div');
        b.className = 'sc-hb-bar';
        b.style.width = `calc((100% - ${o.valW || '7.5em'}) * ${v / max})`;
        b.style.background = s.color;
        track.append(b);
      }
      const val = document.createElement('span');
      val.className = 'sc-hb-val';
      val.textContent = it.valueText;
      track.append(val);
      row.append(lab, track);
      wrap.append(row);
      if (it.tip) tips.set(row, it.tip);
    }
    el.replaceChildren(wrap);
    const tip = SC.tip(el);
    wrap.addEventListener('mousemove', (ev) => { const r = ev.target.closest('.sc-hb-row'); if (r && tips.has(r)) tip.show(ev, tips.get(r)); else tip.hide(); });
    wrap.addEventListener('mouseleave', () => tip.hide());
  };

  // 縦棒（SVG、積み上げ可）
  SC.vbars = (el, o) => {
    const W = Math.max(280, el.clientWidth || 600);
    const H = o.height || 220;
    const subH = o.sub ? 20 : 0;
    el.replaceChildren();
    const svg = d3.select(el).append('svg').attr('class', 'sc-svg').attr('width', W).attr('height', H + subH)
      .attr('role', 'img').attr('aria-label', o.aria);
    const stacks = o.rows.map((r) => { let y0 = 0; return o.series.map((s) => { const v = +r[s.key] || 0; const seg = { r, s, y0, y1: y0 + v, v }; y0 += v; return seg; }); });
    const maxY = d3.max(stacks, (st) => st[st.length - 1].y1) || 1;
    const y0 = d3.scaleLinear().domain([0, maxY * 1.12]).nice();
    const ticks = y0.ticks(4).filter(Number.isInteger);
    const probe = svg.append('text').attr('class', 'sc-tick');
    let lw = 0;
    ticks.forEach((t) => { probe.text(d3.format(',')(t)); lw = Math.max(lw, probe.node().getComputedTextLength()); });
    probe.remove();
    const m = { l: o.noYAxis ? 4 : Math.ceil(lw) + 10, r: 6, t: (o.band ? 20 : 8) + (o.ann ? 16 : 0), b: 24 };
    const y = y0.range([H - m.b, m.t]);
    const x = d3.scaleBand().domain(o.rows.map((_, i) => i)).range([m.l, W - m.r]).paddingInner(0.25).paddingOuter(0.1);
    if (o.band) {
      const idx = o.rows.map((r, i) => (o.band.test(r) ? i : -1)).filter((i) => i >= 0);
      if (idx.length) {
        const bx0 = x(idx[0]) - (x.step() * x.paddingInner()) / 2;
        const bx1 = x(idx[idx.length - 1]) + x.bandwidth() + (x.step() * x.paddingInner()) / 2;
        svg.append('rect').attr('class', 'sc-band').attr('x', bx0).attr('y', m.t - 16).attr('width', bx1 - bx0).attr('height', H - m.b - m.t + 16);
        svg.append('text').attr('class', 'sc-band-label').attr('x', bx0 + 4).attr('y', m.t - 4).text(o.band.label);
      }
    }
    if (!o.noYAxis) svg.append('g').selectAll('line').data(ticks).join('line').attr('class', 'sc-gridline')
      .attr('x1', m.l).attr('x2', W - m.r).attr('y1', (t) => y(t)).attr('y2', (t) => y(t));
    if (!o.noYAxis) svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'sc-tick')
      .attr('x', m.l - 6).attr('y', (t) => y(t)).attr('dy', '0.32em').attr('text-anchor', 'end').text((t) => d3.format(',')(t));
    const g = svg.append('g');
    stacks.forEach((st, i) => {
      st.forEach((seg) => {
        if (!seg.v) return;
        g.append('rect').attr('class', 'sc-vbar').attr('x', x(i)).attr('width', x.bandwidth())
          .attr('y', y(seg.y1)).attr('height', Math.max(0, y(seg.y0) - y(seg.y1)))
          .style('fill', seg.s.color ? (typeof seg.s.color === 'function' ? seg.s.color(seg.r) : seg.s.color) : SC.C.gray);
      });
      const tot = st[st.length - 1].y1;
      const r = o.rows[i];
      if (o.missing && o.missing(r)) {
        svg.append('text').attr('class', 'sc-missing').attr('x', x(i) + x.bandwidth() / 2).attr('y', H - m.b - 6).attr('text-anchor', 'middle').text(o.missingText || 'なし');
      } else if (tot && o.showTotals !== false) {
        svg.append('text').attr('class', 'sc-vlabel').attr('x', x(i) + x.bandwidth() / 2).attr('y', y(tot) - 4).attr('text-anchor', 'middle').text(d3.format(',')(tot));
      }
    });
    svg.append('line').attr('class', 'sc-axis').attr('x1', m.l).attr('x2', W - m.r).attr('y1', H - m.b).attr('y2', H - m.b);
    // 注記（例：配信日・開幕日）。o.ann = [{test(r), text}]
    (o.ann || []).forEach((a) => {
      const i = o.rows.findIndex(a.test);
      if (i < 0) return;
      const cx = x(i) + x.bandwidth() / 2;
      const top = y(stacks[i][stacks[i].length - 1].y1) - 16;
      svg.append('line').attr('class', 'sc-ann-line').attr('x1', cx).attr('x2', cx).attr('y1', 15).attr('y2', Math.max(18, top));
      const t = svg.append('text').attr('class', 'sc-ann').attr('x', cx).attr('y', 11).attr('text-anchor', 'middle').text(a.text);
      const w = t.node().getComputedTextLength();
      if (cx - w / 2 < m.l) t.attr('text-anchor', 'start').attr('x', Math.max(m.l, cx - 6));
      else if (cx + w / 2 > W) t.attr('text-anchor', 'end').attr('x', Math.min(W, cx + 6));
    });
    const every = o.every || (x.step() < 30 ? Math.ceil(30 / x.step()) : 1);
    o.rows.forEach((r, i) => {
      if (i % every) return;
      svg.append('text').attr('class', 'sc-tick').attr('x', x(i) + x.bandwidth() / 2).attr('y', H - m.b + 15).attr('text-anchor', 'middle').text(o.x(r));
    });
    if (o.sub) {
      o.rows.forEach((r, i) => {
        svg.append('text').attr('class', 'sc-sub').attr('x', x(i) + x.bandwidth() / 2).attr('y', H + 12).attr('text-anchor', 'middle').text(o.sub(r));
      });
    }
    const tip = SC.tip(el);
    svg.append('g').selectAll('rect').data(o.rows).join('rect').attr('class', 'sc-hit')
      .attr('x', (_, i) => x(i) - (x.step() * x.paddingInner()) / 2).attr('width', x.step()).attr('y', 0).attr('height', H + subH)
      .on('mousemove', (ev, r) => tip.show(ev, o.tip(r))).on('mouseleave', () => tip.hide());
  };
})();
